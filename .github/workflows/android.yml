name: android

on:
  push:
    branches: [ main ]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: 还原固定签名 keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/keystore.jks
          echo "keystore bytes: $(stat -c %s android/keystore.jks)"

      - name: 构建 release APK（固定签名，可覆盖升级）
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          MCLITE_KEYSTORE: android/keystore.jks
          MCLITE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MCLITE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MCLITE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: 构建 debug APK（未配置签名密钥时的兜底）
        if: ${{ secrets.KEYSTORE_BASE64 == '' }}
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: 校验证书指纹
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK" | head -n 5

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: MCLite-android-apk
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
