name: build

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 语法检查
        run: python -m compileall -q mclite main.py

      - name: 安装 PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: 打包单文件 exe
        run: pyinstaller --noconfirm --clean --onefile --windowed --name MCLite main.py

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: MCLite-windows
          path: dist/MCLite.exe
          if-no-files-found: error

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MCLite.exe
          generate_release_notes: true
